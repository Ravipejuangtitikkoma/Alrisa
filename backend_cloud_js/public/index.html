<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXORA Cloud Monitor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0f19; color: #f3f4f6; padding: 24px; }
    .container { max-width: 900px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid #1f293d; margin-bottom: 24px; }
    h1 { font-size: 24px; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .status-badge { background: #064e3b; color: #34d399; font-size: 12px; padding: 4px 10px; border-radius: 999px; font-weight: 600; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-bottom: 30px; }
    .card { background: #131b2e; border: 1px solid #1e293b; border-radius: 12px; padding: 18px; transition: transform 0.2s; }
    .card:hover { transform: translateY(-2px); border-color: #38bdf8; }
    .card-title { font-size: 14px; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .card-name { font-size: 18px; font-weight: 600; margin-bottom: 14px; }
    .card-state { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 13px; font-weight: bold; margin-bottom: 14px; }
    .state-on { background: #064e3b; color: #34d399; }
    .state-off { background: #374151; color: #9ca3af; }
    .btn-group { display: flex; gap: 8px; }
    button { flex: 1; padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; transition: opacity 0.2s; }
    button:hover { opacity: 0.85; }
    .btn-on { background: #0284c7; color: white; }
    .btn-off { background: #374151; color: #d1d5db; }
    .section-title { font-size: 16px; color: #94a3b8; margin-bottom: 12px; font-weight: 600; }
    .logs-box { background: #131b2e; border: 1px solid #1e293b; border-radius: 12px; padding: 14px; height: 200px; overflow-y: auto; font-family: monospace; font-size: 12px; }
    .log-item { padding: 4px 0; border-bottom: 1px solid #1a2234; color: #94a3b8; }
    .log-time { color: #38bdf8; }
    .log-origin { color: #f59e0b; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>☁️ NEXORA Cloud Hub</h1>
        <p style="color: #64748b; font-size: 13px; margin-top: 4px;">Node.js Real-time Gateway (Flutter &harr; Raspberry Pi / PLC)</p>
      </div>
      <div id="conn-status" class="status-badge">ONLINE • LOCAL TEST</div>
    </header>

    <div class="section-title">STATUS PERANGKAT (REAL-TIME)</div>
    <div class="grid" id="devices-container">
      <!-- Cards diisi oleh JS -->
    </div>

    <div class="section-title">LOG AKTIVITAS CLOUD TERAKHIR</div>
    <div class="logs-box" id="logs-container">
      <div class="log-item">Menunggu aktivitas perangkat...</div>
    </div>
  </div>

  <script>
    async function fetchDevices() {
      try {
        const res = await fetch('/api/devices');
        const json = await res.json();
        if (json.success) renderDevices(json.data);
      } catch (e) {
        console.error(e);
      }
    }

    async function fetchLogs() {
      try {
        const res = await fetch('/api/logs');
        const json = await res.json();
        if (json.success && json.data.length > 0) renderLogs(json.data);
      } catch (e) {
        console.error(e);
      }
    }

    function renderDevices(devices) {
      const container = document.getElementById('devices-container');
      container.innerHTML = devices.map(d => `
        <div class="card">
          <div class="card-title">${d.id}</div>
          <div class="card-name">${d.name}</div>
          <div>
            <span class="card-state ${d.state ? 'state-on' : 'state-off'}">
              ${d.state ? '🟢 TERBUKA / ON' : '⚪ TERTUTUP / OFF'}
            </span>
          </div>
          <div class="btn-group">
            <button class="btn-on" onclick="controlDevice('${d.id}', true)">ON / BUKA</button>
            <button class="btn-off" onclick="controlDevice('${d.id}', false)">OFF / TUTUP</button>
          </div>
        </div>
      `).join('');
    }

    function renderLogs(logs) {
      const container = document.getElementById('logs-container');
      container.innerHTML = logs.map(l => `
        <div class="log-item">
          <span class="log-time">[${l.timestamp}]</span>
          <span class="log-origin">[${l.origin}]</span>
          <b>${l.deviceId}:</b> ${l.action}
        </div>
      `).join('');
    }

    async function controlDevice(deviceId, state) {
      try {
        await fetch(`/api/devices/${deviceId}/control`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ state })
        });
        fetchDevices();
        fetchLogs();
      } catch (e) {
        alert('Gagal mengirim perintah: ' + e);
      }
    }

    // Polling setiap 1.5 detik untuk monitoring lokal
    setInterval(() => {
      fetchDevices();
      fetchLogs();
    }, 1500);

    fetchDevices();
    fetchLogs();
  </script>
</body>
</html>
